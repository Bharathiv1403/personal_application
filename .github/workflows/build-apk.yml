name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish APK to GitHub Releases?'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-android:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🛠️ Prebuild Android Native Files
        env:
          EXPO_PUBLIC_APP_ENV: production
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
          EXPO_PUBLIC_GROQ_API_KEY: ${{ secrets.EXPO_PUBLIC_GROQ_API_KEY }}
          EXPO_PUBLIC_HUGGINGFACE_API_KEY: ${{ secrets.EXPO_PUBLIC_HUGGINGFACE_API_KEY }}
          EXPO_PUBLIC_OLLAMA_URL: ${{ secrets.EXPO_PUBLIC_OLLAMA_URL }}
          EXPO_PUBLIC_WEATHER_API_KEY: ${{ secrets.EXPO_PUBLIC_WEATHER_API_KEY }}
          EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID }}
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Build Android Release APK
        env:
          EXPO_PUBLIC_APP_ENV: production
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
          EXPO_PUBLIC_GROQ_API_KEY: ${{ secrets.EXPO_PUBLIC_GROQ_API_KEY }}
          EXPO_PUBLIC_HUGGINGFACE_API_KEY: ${{ secrets.EXPO_PUBLIC_HUGGINGFACE_API_KEY }}
          EXPO_PUBLIC_OLLAMA_URL: ${{ secrets.EXPO_PUBLIC_OLLAMA_URL }}
          EXPO_PUBLIC_WEATHER_API_KEY: ${{ secrets.EXPO_PUBLIC_WEATHER_API_KEY }}
          EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 📋 Prepare APK Output
        run: |
          mkdir -p build-output
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/release/app-release.apk build-output/aayon-v${VERSION}.apk
          echo "APK ready at build-output/aayon-v${VERSION}.apk"
          echo "APP_VERSION=${VERSION}" >> $GITHUB_ENV
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=v${VERSION}-build${{ github.run_number }}" >> $GITHUB_ENV
          fi
          echo "RELEASE_TITLE=AAYON v${VERSION} (Build #${{ github.run_number }})" >> $GITHUB_ENV

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aayon-apk
          path: build-output/*.apk
          retention-days: 30

      - name: 🚀 Publish APK to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          body: |
            ### 📱 AAYON Personal Life OS - Android Build
            
            - **Version:** ${{ env.APP_VERSION }}
            - **Commit:** ${{ github.sha }}
            - **Branch:** ${{ github.ref_name }}
            - **Build Number:** #${{ github.run_number }}
            
            #### ⬇️ Installation:
            Download the `aayon-v${{ env.APP_VERSION }}.apk` attached below and install it directly on your Android phone.
          files: build-output/*.apk
          draft: false
          prerelease: false
